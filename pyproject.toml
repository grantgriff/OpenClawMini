[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclawmini"
version = "0.1.0"
description = "Your Personal AI That Learns To Be You - Mistral Hackathon"
authors = [{ name = "Grant Griffin" }]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Gmail integration
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    # Gemini LLM for fact extraction (new unified SDK, replaces google-generativeai)
    "google-genai>=1.0",
    # HTML email body stripping + web scraping
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    # Web search (no API key required)
    "duckduckgo-search>=6.0",
    # Mistral API (kept for legacy compatibility)
    "mistralai>=1.0",
    # OpenAI-compatible client (used for OpenPipe inference)
    "openai>=1.0",
    # DataSimulator SDK (SFT dataset generation)
    "datasimulator @ git+https://github.com/grantgriff/datasimulator.git",
    # Weights & Biases (eval metric logging)
    "wandb>=0.18",
    # Weave — W&B LLM trace logging (@weave.op() on RULER + eval LLM calls)
    "weave>=0.50",
    # ART — W&B/OpenPipe Serverless RL framework (SFT + GRPO via CoreWeave)
    "openpipe-art>=0.5.0",
    # Anthropic SDK (Claude Opus orchestrator)
    "anthropic>=0.34",
    # HuggingFace Hub (model export/upload after fine-tuning)
    "huggingface_hub>=0.20",
    # PDF text extraction (for resume / bio uploads)
    "pypdf>=4.0",
]

[project.scripts]
openclawmini = "openclawmini.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["openclawmini*"]
