[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclawmini"
version = "0.1.0"
description = "Your Personal AI That Learns To Be You - Mistral Hackathon"
authors = [{ name = "Grant Griffin" }]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Gmail integration
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    # HTML email body stripping
    "beautifulsoup4>=4.12",
]

[project.scripts]
openclawmini = "openclawmini.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["openclawmini*"]
